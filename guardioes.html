<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seu Guardião</title>

    <link rel="stylesheet" href="assets/css/guardioes.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />

    <script src="assets/js/guardioes.js" defer></script>
  </head>
  <body>
    <div class="game-shell">
      <main class="guardian-screen" id="main-container">
        <section class="dialogue-hud-container">
          <div class="guardian-portrait-info">
            <div class="guardian-portrait-container"></div>
            <h1 id="guardian-name"></h1>
            <p id="guardian-title"></p>
          </div>

          <div class="dialogue-text-and-button">
            <div id="dialogue-box" class="dialogue-box">
              <p id="dialogue-text"></p>
            </div>

            <button id="continuar-jornada-btn" class="continue-btn hidden">
              Continuar Jornada
            </button>
          </div>

          <audio
            id="musica-inicio"
            src="assets/audio/tarefas - Digestive biscuit.mp3"
            preload="auto"
            loop
          ></audio>
        </section>
      </main>
    </div>
  </body>
</html>
