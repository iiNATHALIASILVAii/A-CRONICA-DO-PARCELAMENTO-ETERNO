<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa Interativo</title>
    <link rel="stylesheet" href="assets/css/mapa.css" />
    <script src="assets/js/mapa.js" defer></script>
  </head>
  <body>
    <div class="game-shell">
      <main class="map-screen">
        <div class="map-container">
          <button class="hotspot oracle" data-area="Oráculo" aria-label="Oráculo"></button>
          <button class="hotspot flora" data-area="Clareira do Corpo" aria-label="Clareira do Corpo"></button>
          <button class="hotspot mentis" data-area="Torre do Conhecimento" aria-label="Torre do Conhecimento"></button>
          <button class="hotspot ordus" data-area="Templo do Caos" aria-label="Templo do Caos"></button>
          <button class="hotspot lumen" data-area="Caverna Interior" aria-label="Caverna Interior"></button>
          <button class="hotspot lux" data-area="Aurora Digital" aria-label="Aurora Digital"></button>
          <button class="hotspot livro" data-area="Livro das Tarefas" aria-label="Livro das Tarefas"></button>
        </div>
      </main>
    </div>
  </body>
</html>
